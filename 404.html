<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Strona nie znaleziona — Expert Financial</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--navy-950:#070c17;--navy-900:#0b1526;--lime-400:#cdeb52;--muted:#aab4c9;}
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--navy-950);color:#fff;
    font-family:'Manrope',system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;gap:22px;
  }
  .mark{width:72px;height:72px;}
  h1{font-family:'Sora',system-ui,sans-serif;font-weight:800;font-size:clamp(28px,5vw,42px);margin:0;}
  p{color:var(--muted);font-size:16px;max-width:420px;margin:0;line-height:1.6;}
  .code{font-family:'Sora',system-ui,sans-serif;font-weight:800;font-size:14px;letter-spacing:3px;color:var(--lime-400);text-transform:uppercase;}
  a.btn{
    display:inline-flex;align-items:center;gap:10px;margin-top:6px;
    background:var(--lime-400);color:var(--navy-900);font-family:'Sora',system-ui,sans-serif;font-weight:700;font-size:15px;
    padding:14px 26px;border-radius:12px;text-decoration:none;
  }
</style>
</head>
<body>
  <svg class="mark" aria-hidden="true" focusable="false" viewBox="0 0 64 64" fill="none">
    <circle cx="32" cy="32" r="30" fill="#101f38" stroke="#233151" stroke-width="1.5"/>
    <path d="M16 40 L27 28 L35 35 L48 20" stroke="#cdeb52" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 20 H48 V28" stroke="#cdeb52" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <span class="code">404</span>
  <h1>Tej strony tu nie ma</h1>
  <p>Strona mogła zostać przeniesiona albo usunięta. Wróć na stronę główną — tam znajdziesz pełną ofertę i kontakt do doradcy.</p>
  <a class="btn" href="/">Wróć na stronę główną →</a>
</body>
</html>
